services:
  database:
    build:
      context: ./postgresql
      dockerfile: Dockerfile
    container_name: lorrator-postgresql
    restart: unless-stopped
    ports:
      - "5400:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
      - ./postgresql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  model-serving:
    volumes:
      - ./model-serving:/app
      - /app/.venv

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lorrator-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
