[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [{ name = "jason9294", email = "jason9294@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "pyjwt>=2.11.0,<3.0.0",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (==4.0.1)",
    "sqlmodel>=0.0.37",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "uuid7 (>=0.1.0,<0.2.0)",
    "asyncpg>=0.31.0",
    "psycopg[binary] (>=3.2.10,<4.0.0)",
    "alembic-postgresql-enum>=1.10.0",
    "pgvector>=0.4.2",
    "scalar-fastapi>=1.8.2",
    "markitdown[all]>=0.1.5",
    "tiktoken>=0.12.0",
    "openai>=2.32.0",
    "neo4j>=6.1.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "ruff>=0.15.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "typer>=0.24.1",
    "basedpyright>=1.39.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4
exclude = [".venv", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = [".venv", "__pycache__"]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# pytest-asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# 註冊 markers
markers = ["endpoint: 端點測試"]
